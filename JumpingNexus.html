<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#020712">
  <title>Jumping Nexus</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #010712;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #game {
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #02050c;
    }

    /* ── Portrait rotation overlay ──────────────────────────── */
    #rotate-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: #020712;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 32px;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, sans-serif;
      color: #cdeeff;
      text-align: center;
    }
    @media (pointer: coarse) and (max-width: 1024px) and (orientation: portrait) {
      #rotate-overlay { display: flex; }
    }
    .rotate-phone {
      font-size: 64px;
      animation: rotatePhone 2.2s ease-in-out infinite;
      display: block;
      line-height: 1;
    }
    @keyframes rotatePhone {
      0%   { transform: rotate(0deg); }
      35%  { transform: rotate(0deg); }
      55%  { transform: rotate(90deg); }
      80%  { transform: rotate(90deg); }
      100% { transform: rotate(0deg); }
    }
    .rotate-title {
      font-size: 18px;
      font-weight: 700;
      color: #eaf6ff;
      letter-spacing: 0.04em;
      margin: 0;
    }
    .rotate-sub {
      font-size: 14px;
      color: rgba(140, 200, 230, 0.75);
      margin: 0;
      line-height: 1.5;
    }
    .rotate-divider {
      width: 80px;
      height: 1px;
      background: rgba(79, 180, 255, 0.35);
    }
  </style>
</head>
<body>
<div id="rotate-overlay">
  <span class="rotate-phone">📱</span>
  <h2 class="rotate-title">Bitte Handy drehen</h2>
  <p class="rotate-sub">Jumping Nexus läuft<br>am besten quer.</p>
  <div class="rotate-divider"></div>
</div>
<canvas id="game"></canvas>
<script src="gameTest.js"></script>
</body>
</html>
